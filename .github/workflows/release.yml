name: Public Release

on:
  push:
    tags: '*.*.*'
    paths-ignore:
      - 'package.json'
      - 'package-lock.json'
      - '*.md'

jobs:
  build-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          ref: main
          fetch-depth: 0
          # Persist an admin credential so the automated version-bump push
          # below satisfies the branch-protection ruleset's repo-admin bypass;
          # the default GITHUB_TOKEN (github-actions[bot]) is not a bypass
          # actor and would be rejected once PR enforcement is active. SK-2986.
          token: ${{ secrets.PAT_ACTIONS }}
      - uses: actions/setup-node@v1
        with:
          node-version: 14.21.3
          registry-url: 'https://registry.npmjs.org'


      - name: install modules
        run: npm install --ignore-scripts

      - name: Get Previous tag
        id: previoustag
        uses: WyriHaximus/github-action-get-previous-tag@v1
        with:
          fallback: 1.0.0

      - name: Bump Version
        run: |
          chmod +x ./scripts/bump_version.sh
          ./scripts/bump_version.sh "${{ steps.previoustag.outputs.tag }}"

      - name: Commit changes
        run: |
          git config user.name ${{ github.actor }}
          git config user.email ${{ github.actor }}@users.noreply.github.com
          git add package.json
          git add README.md
          git commit -m "[AUTOMATED] Public Release - ${{ steps.previoustag.outputs.tag }}"
          git push

      - name: Build
        run: npm run build

      - name: publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}